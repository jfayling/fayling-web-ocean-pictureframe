<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fayling-web-ocean-pictureframe</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; color: #e8e2d6; font: 15px/1.5 system-ui, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  section { width: min(1600px, 100%); }
  section + section { margin-top: 48px; }
  video { width: 100%; height: auto; background: #000; }
  p { max-width: 40rem; margin: 16px 0 0; opacity: .8; }
  a { color: #e2a04e; }
</style>
</head>
<body>
<main>
  <section id="timelapse">
    <video controls playsinline preload="metadata" poster="timelapse.jpg">
      <source src="timelapse.mp4" type="video/mp4">
    </video>
    <p>Sixty seconds of a time lapse at Newnan, Georgia, starting at 7:56 PM on October 18, 2026. The clock keeps the real time, and the weather card stays at the top left. Press play and use the sound control to hear the water.</p>
  </section>
  <p>The renderer itself is in the <a href="https://github.com/jfayling/fayling-web-ocean-pictureframe">repository</a>.</p>
</main>
</body>
</html>
